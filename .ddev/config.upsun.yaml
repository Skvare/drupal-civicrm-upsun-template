hooks:
  pre-start:
  - exec-host: chmod +w ${DDEV_DOCROOT:-web}/sites/default ${DDEV_DOCROOT:-web}/sites/default/settings*php
      2>/dev/null || true
  post-start:
  - exec: chmod +w ${DDEV_DOCROOT:-web}/sites/default ${DDEV_DOCROOT:-web}/sites/default/settings*php
      2>/dev/null || true
  - exec: if [ -f composer.json ] && [ ! -d vendor ]; then composer install --no-dev
      --optimize-autoloader; fi
  - exec: if [ -f vendor/bin/drush ]; then mkdir -p ~/.drush; ln -sf /var/www/html/.drush/drush.yml
      ~/.drush/drush.yml 2>/dev/null || true; fi
  - exec: |
      cd /var/www/html
      set -e
      #Run Composer install
      composer install --no-dev --prefer-dist --no-progress --no-interaction
  - exec: "cd /var/www/html\nset -e\nif [ \"$S3_BACKUP\" = \"On\" ]; then\n  # Import
      private key\n  export GNUPGHOME=/tmp/gnupg\n  mkdir /tmp/gnupg\n  cd /tmp/gnupg\n\n
      \ # Import public key \n  echo \"$GPG_PUBLIC_KEY\" > /tmp/gnupg/public.key\n
      \ gpg --batch --import /tmp/gnupg/public.key\n  # Add trust to public key\n
      \ echo -e \"trust\\n5\\ny\\n\" | gpg --command-fd 0 --edit-key \"$GPG_KEY_ID\"\n
      \ echo \"$GPG_KEY_PART1$GPG_KEY_PART2\" > /tmp/gnupg/private.key\n  gpg --batch
      --import /tmp/gnupg/private.key\nfi\n\nphp ./drush/platformsh_generate_drush_yml.php\n#
      if drupal is installed, will call the following drush commands:\n#   - `cache-rebuild`\n#
      \  - `updatedb`\n#   - and if config files are present, `config-import`\ncd
      web\nbash $PLATFORM_APP_DIR/drush/platformsh_deploy_drupal.sh"
  - exec: if [ -f vendor/bin/drush ] && [ -d config/sync ] && [ "$(find config/sync
      -name "*.yml" 2>/dev/null | wc -l)" -gt 0 ]; then cd web && ../vendor/bin/drush
      config:import --yes || true; fi
